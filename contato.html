<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ford | Contato</title>
    <link href="css/reset.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/form.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
    <script src="js/form.js"></script>
</head>
<body>

    <header>
        <div>
            <img src="img/logo-ford-256.png" width="130" class="logo" alt="Ford">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="lancamento.html">Lançamento</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="contact-page">

            <img src="img/xls 2.2 diesel.jpg" alt="Ford Ranger XLS" class="contact-car-img">


            <div class="forms" data-aos="fade-left">
                <p class="section-label">Fale Conosco</p>
                <h2 class="titulo">Sobre Você</h2>
                <form onsubmit="return Post(this);">
                    <input type="text" name="nome" placeholder="Nome*" class="fordform" required>
                    <input type="text" name="email" placeholder="E-mail*" class="fordform" required>
                    <input type="text" name="telefone" placeholder="Telefone*" class="fordform" required>
                    <select name="contato" class="fordform" title="Motivo do contato" required>
                        <option value="" selected disabled>Qual o motivo do contato?</option>
                        <option>Elogio</option>
                        <option>Dúvida</option>
                        <option>Reclamação</option>
                    </select>
                    <input type="text" name="mensagem" placeholder="Mensagem*" class="fordform" required>

                    <!-- Consentimento LGPD -->
                    <p class="consent-text">
                        Os dados serão mantidos em nossa base de dados, só enquanto for desejado por você.
                        A qualquer momento, será possível editar ou remover tais dados.
                    </p>

                    <div class="consent-checks">
                        <label class="consent-label">
                            <input type="checkbox" id="terms-check"
                                onchange="document.getElementById('submit-btn').disabled = !this.checked">
                            Sim. Li e concordo com os
                            <a href="https://www.ford.com.br/politica-de-privacidade/"
                               target="_blank" rel="noopener noreferrer">Termos e Condições</a>.
                        </label>

                        <label class="consent-label">
                            <input type="checkbox" name="newsletter">
                            Sim. Também quero receber descontos e novidades.
                        </label>
                    </div>

                    <button type="submit" id="submit-btn" disabled>Enviar mensagem</button>
                </form>
            </div>

        </div>
    </main>

    <footer>
        <nav id="social">
            <ul>
                <li><span class="redesociais">Redes Sociais</span></li>
                <li><a href="https://www.facebook.com/FordBrasil/" title="Facebook"><img src="img/facebook-50.png" alt="Facebook"></a></li>
                <li><a href="https://www.youtube.com/fordbrasil" title="YouTube"><img src="img/youtube-squared-50.png" alt="YouTube"></a></li>
                <li><a href="https://www.instagram.com/fordbrasil/" title="Instagram"><img src="img/instagram-logo-50.png" alt="Instagram"></a></li>
            </ul>
        </nav>
        <div>
            <img src="img/ford-96.png" alt="Ford" width="60">
        </div>
    </footer>

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="js/premium.js"></script>
</body>
</html>
